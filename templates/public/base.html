<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Dinámico inyectado desde SQLite -->
    <title>{% block title %}{{ seo.meta_titulo if seo else 'Cargando...' }}{% endblock %}</title>
    <meta name="description" content="{{ seo.meta_descripcion if seo else '' }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS base del sitio público -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_public.css') }}">

    <!-- CSS específico de cada módulo (cada vista hija agrega aquí lo que necesite) -->
    {% block extra_css %}{% endblock %}

    <!-- Layout base para que el footer siempre quede pegado al fondo,
         incluso en páginas cuyo contenido no llena el alto de la pantalla. -->
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        body > main {
            flex: 1 0 auto;
        }
        body > footer.site-footer {
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    {% include 'public/partials/navbar.html' %}

    <!-- Aquí se inyectará el contenido de las otras plantillas -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer bg-dark text-white-50 text-center py-4">
        <div class="container">
            <p class="mb-0 small">&copy; Dynamic Landing CMS</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS específico de cada módulo (opcional, mismo patrón que el CSS) -->
    {% block extra_js %}{% endblock %}
</body>
</html>
