{% extends "admin/base_admin.html" %}

{% block title %}Sobre Nosotros{% endblock %}

{% block content %}
<h3>Propuesta de Valor / Sobre Nosotros</h3>

<div class="card shadow-sm mt-4">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Título Principal</label>
                <input class="form-control" type="text" name="titulo" value="{{ nosotros.titulo }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción / Historia</label>
                <textarea class="form-control" name="descripcion" id="descripcion-textarea" rows="5" required>{{ nosotros.descripcion }}</textarea>
                <div id="descripcion-editor" style="display:none;"></div>
                <div id="descripcion-error" class="text-danger small mt-1" style="display:none;">
                    Este campo no puede quedar vacío.
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Visión o Misión (Texto destacado)</label>
                <textarea class="form-control" name="mision" rows="3">{{ nosotros.mision }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    inicializarEditorEnriquecido({
        textareaId: 'descripcion-textarea',
        editorId: 'descripcion-editor',
        errorId: 'descripcion-error',
        placeholder: 'Cuenta la historia de tu negocio...',
        toolbar: [
            ['bold', 'italic', 'underline'],
            ['link'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['clean']
        ]
    });
</script>
{% endblock %}
