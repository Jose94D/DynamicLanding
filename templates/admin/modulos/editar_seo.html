{% extends "admin/base_admin.html" %}

{% block title %}Configuración SEO{% endblock %}

{% block content %}
<h3>Configuración SEO</h3>

<div class="card shadow-sm mt-4" style="max-width: 700px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Título de la página (&lt;title&gt;)</label>
                <input class="form-control" type="text" name="meta_titulo" value="{{ seo.meta_titulo }}" maxlength="60" required>
                <small class="text-muted">Recomendado: máx. 60 caracteres.</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Meta descripción</label>
                <textarea class="form-control" name="meta_descripcion" rows="3" maxlength="160" required>{{ seo.meta_descripcion }}</textarea>
                <small class="text-muted">Recomendado: máx. 160 caracteres.</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Imagen Open Graph (nombre de archivo en /static/img/, opcional)</label>
                <input class="form-control" type="text" name="og_image" value="{{ seo.og_image or '' }}">
                <small class="text-muted">Se usa como miniatura al compartir el link en redes sociales.</small>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
