{% extends "admin/base_admin.html" %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/modulos_admin/cambiar_password.css') }}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card border shadow-sm rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="admin-icon-circle bg-light rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h3 class="fs-5 fw-semibold mb-1">Cambiar contraseña</h3>
                <p class="text-secondary small mb-0">Actualiza tu contraseña para mantener tu cuenta segura.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Contraseña actual</label>
                    <input type="password" class="form-control" name="password_actual" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" name="password_nueva" minlength="8" required>
                    <div class="form-text">
                        <i class="bi bi-info-circle"></i> Mínimo 8 caracteres
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirmar nueva contraseña</label>
                    <input type="password" class="form-control" name="password_confirmar" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">Actualizar contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
